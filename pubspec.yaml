name: gaongram_chat
description: "GaonGram - Social Feed & Video Calling App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dependency Injection
  get_it: ^8.0.3

  # Permissions
  permission_handler: ^11.3.1

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.1
  google_fonts: ^6.2.1

  # Environment
  flutter_dotenv: ^5.2.1

  # Agora RTC
  agora_rtc_engine: ^6.3.2

  # Functional Programming
  fpdart: ^1.1.0

  # UUID
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/illustrations/
